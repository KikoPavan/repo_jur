[project]
name = "repo-jur"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.14.0",
    "markitdown-ocr>=0.1.0",
    "markitdown[all]>=0.1.5",
    "openai>=2.48.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
converter-juridico = "pipeline_juridico.cli:main"
repo-jur = "pipeline_juridico.domain_router_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_juridico"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
